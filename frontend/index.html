<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Conversion Engine</title>
    <script>
      window.tailwind = {
        config: {
          theme: {
            extend: {
              boxShadow: {
                enterprise: "0 18px 45px rgba(15, 23, 42, 0.10)",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-slate-100 text-slate-950 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      function Icon({ name, className = "h-4 w-4" }) {
        return <i data-lucide={name} className={className}></i>;
      }

      function EngineBadge({ engine }) {
        const isMips = String(engine).toLowerCase().includes("mips");
        return (
          <span
            className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ${
              isMips
                ? "bg-violet-50 text-violet-700 ring-violet-200"
                : "bg-blue-50 text-blue-700 ring-blue-200"
            }`}
          >
            <span className={`h-1.5 w-1.5 rounded-full ${isMips ? "bg-violet-500" : "bg-blue-500"}`}></span>
            {isMips ? "MIPS/MARS" : "Python API"}
          </span>
        );
      }

      function App() {
        const API_BASE = "http://127.0.0.1:5000";
        const [categories, setCategories] = useState([]);
        const [logs, setLogs] = useState([]);
        const [category, setCategory] = useState("");
        const [conversion, setConversion] = useState("");
        const [value, setValue] = useState("");
        const [status, setStatus] = useState("");
        const [busy, setBusy] = useState(false);

        useEffect(() => {
          Promise.all([fetch(`${API_BASE}/categories`), fetch(`${API_BASE}/logs`)])
            .then(async ([categoryResponse, logResponse]) => {
              const categoryData = await categoryResponse.json();
              setCategories(categoryData);
              setLogs(await logResponse.json());
              setCategory(categoryData[0]?.id || "");
              setConversion(categoryData[0]?.conversions[0]?.id || "");
            })
            .catch(() => setStatus("Backend is not reachable."));
        }, []);

        useEffect(() => {
          const selected = categories.find((item) => String(item.id) === String(category));
          setConversion(selected?.conversions[0]?.id || "");
        }, [category]);

        useEffect(() => {
          lucide.createIcons();
        });

        const selectedCategory = useMemo(
          () => categories.find((item) => String(item.id) === String(category)),
          [categories, category]
        );

        const selectedConversion = useMemo(
          () => selectedCategory?.conversions.find((item) => String(item.id) === String(conversion)),
          [selectedCategory, conversion]
        );

        const labels = useMemo(() => {
          const categoryMap = Object.fromEntries(categories.map((item) => [String(item.id), item.label]));
          const conversionMap = {};
          categories.forEach((item) => {
            item.conversions.forEach((conv) => {
              conversionMap[`${item.id}:${conv.id}`] = conv.label;
            });
          });
          return { categoryMap, conversionMap };
        }, [categories]);

        async function refreshLogs() {
          const response = await fetch(`${API_BASE}/logs`);
          setLogs(await response.json());
        }

        async function handleConvert(event) {
          event.preventDefault();
          setBusy(true);
          setStatus("");
          try {
            const response = await fetch(`${API_BASE}/convert`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                category_id: Number(category),
                conversion_id: Number(conversion),
                input_value: Number(value),
              }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Conversion failed.");
            setLogs((current) => [data, ...current]);
            setStatus(`Result: ${Number(data.result).toLocaleString(undefined, { maximumFractionDigits: 6 })}`);
          } catch (error) {
            setStatus(error.message);
          } finally {
            setBusy(false);
          }
        }

        async function deleteLog(id) {
          await fetch(`${API_BASE}/logs/${id}`, { method: "DELETE" });
          setLogs((current) => current.filter((item) => item.id !== id));
        }

        async function clearLogs() {
          await fetch(`${API_BASE}/logs`, { method: "DELETE" });
          setLogs([]);
        }

        const inputClass =
          "mt-2 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-3 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100";

        return (
          <main className="min-h-screen bg-[radial-gradient(circle_at_top_left,rgba(59,130,246,0.16),transparent_34%),linear-gradient(180deg,#f8fafc_0%,#eef2f7_100%)]">
            <section className="border-b border-white/70 bg-white/85 backdrop-blur">
              <div className="mx-auto flex max-w-7xl flex-col gap-5 px-4 py-6 sm:px-6 lg:flex-row lg:items-center lg:justify-between">
                <div className="flex items-center gap-4">
                  <div className="flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/25">
                    <Icon name="blocks" className="h-6 w-6" />
                  </div>
                  <div>
                    <h1 className="text-2xl font-semibold tracking-normal text-slate-950 sm:text-3xl">Universal Conversion Engine</h1>
                    <p className="mt-1 text-sm text-slate-600">MIPS logic core, Flask bridge, persistent audit history.</p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-3">
                  <div className="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm">
                    <Icon name="database" className="h-4 w-4 text-indigo-600" />
                    <span>{logs.length} logged conversions</span>
                  </div>
                  <div className="inline-flex items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-4 py-2 text-sm font-semibold text-emerald-700">
                    <span className="h-2 w-2 rounded-full bg-emerald-500"></span>
                    Online
                  </div>
                </div>
              </div>
            </section>

            <section className="mx-auto grid max-w-7xl gap-6 px-4 py-6 sm:px-6 lg:grid-cols-[390px_1fr]">
              <form onSubmit={handleConvert} className="rounded-xl border border-white bg-white/95 p-5 shadow-enterprise ring-1 ring-slate-200/70">
                <div className="mb-6 flex items-start justify-between gap-4">
                  <div>
                    <p className="text-xs font-semibold uppercase tracking-wide text-indigo-600">Conversion Console</p>
                    <h2 className="mt-1 text-lg font-semibold text-slate-950">Converter</h2>
                  </div>
                  <div className="inline-flex items-center gap-2 rounded-full border border-violet-200 bg-violet-50 px-3 py-2 text-sm font-semibold text-violet-700">
                    <span className="h-2 w-2 rounded-full bg-violet-500"></span>
                    MIPS/MARS
                  </div>
                </div>

                <div className="space-y-4">
                  <label className="block text-sm font-semibold text-slate-700">
                    Category
                    <select value={category} onChange={(event) => setCategory(event.target.value)} className={inputClass}>
                      {categories.map((item) => <option key={item.id} value={item.id}>{item.label}</option>)}
                    </select>
                  </label>

                  <label className="block text-sm font-semibold text-slate-700">
                    Conversion
                    <select value={conversion} onChange={(event) => setConversion(event.target.value)} className={inputClass}>
                      {selectedCategory?.conversions.map((item) => <option key={item.id} value={item.id}>{item.label}</option>)}
                    </select>
                  </label>

                  <label className="block text-sm font-semibold text-slate-700">
                    Input Value
                    <input value={value} onChange={(event) => setValue(event.target.value)} required type="number" step="any" className={inputClass} placeholder="0.00" />
                  </label>

                </div>

                <button disabled={busy} className="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:-translate-y-0.5 hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200 disabled:cursor-not-allowed disabled:bg-slate-400 disabled:shadow-none">
                  <Icon name={busy ? "loader-2" : "calculator"} className={`h-4 w-4 ${busy ? "animate-spin" : ""}`} />
                  {busy ? "Converting..." : "Convert"}
                </button>

                {status && (
                  <p className="mt-5 rounded-xl border border-indigo-100 bg-indigo-50 px-4 py-3 text-sm font-medium text-indigo-800">
                    {status}
                  </p>
                )}

                <div className="mt-5 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3">
                  <p className="text-xs font-semibold uppercase tracking-wide text-slate-500">Selected Route</p>
                  <p className="mt-1 text-sm font-medium text-slate-800">{selectedCategory?.label || "Category"} / {selectedConversion?.label || "Conversion"}</p>
                </div>
              </form>

              <div className="overflow-hidden rounded-xl border border-white bg-white/95 shadow-enterprise ring-1 ring-slate-200/70">
                <div className="flex flex-col gap-4 border-b border-slate-200 bg-white px-5 py-4 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <p className="text-xs font-semibold uppercase tracking-wide text-indigo-600">Audit Trail</p>
                    <h2 className="mt-1 text-lg font-semibold text-slate-950">System Log</h2>
                  </div>
                  <div className="flex flex-wrap items-center gap-3">
                    <div className="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-semibold text-slate-700">
                      <Icon name="list-checks" className="h-4 w-4 text-indigo-600" />
                      {logs.length} records
                    </div>
                    <button onClick={clearLogs} className="inline-flex items-center justify-center gap-2 rounded-xl border border-rose-200 bg-white px-3.5 py-2.5 text-sm font-semibold text-rose-700 shadow-sm transition hover:-translate-y-0.5 hover:bg-rose-50 focus:outline-none focus:ring-4 focus:ring-rose-100">
                      <Icon name="trash-2" />
                      Clear
                    </button>
                  </div>
                </div>

                <div className="max-h-[620px] overflow-auto">
                  <table className="w-full min-w-[820px] border-collapse text-left text-sm">
                    <thead className="sticky top-0 z-10 bg-slate-900 text-xs uppercase text-slate-200 shadow-sm">
                      <tr>
                        <th className="px-5 py-3.5 font-semibold">Time</th>
                        <th className="px-5 py-3.5 font-semibold">Category</th>
                        <th className="px-5 py-3.5 font-semibold">Conversion</th>
                        <th className="px-5 py-3.5 font-semibold">Input</th>
                        <th className="px-5 py-3.5 font-semibold">Result</th>
                        <th className="px-5 py-3.5 font-semibold">Engine</th>
                        <th className="px-5 py-3.5"></th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 bg-white">
                      {logs.map((item) => (
                        <tr key={item.id} className="transition hover:bg-slate-50">
                          <td className="whitespace-nowrap px-5 py-4 text-slate-600">{new Date(item.created_at).toLocaleString()}</td>
                          <td className="px-5 py-4 font-medium text-slate-800">{labels.categoryMap[item.category] || item.category}</td>
                          <td className="px-5 py-4 text-slate-700">{labels.conversionMap[`${item.category}:${item.conversion}`] || item.conversion}</td>
                          <td className="px-5 py-4 font-mono text-slate-700">{Number(item.input_value).toLocaleString()}</td>
                          <td className="px-5 py-4 font-mono font-semibold text-slate-950">{Number(item.result).toLocaleString(undefined, { maximumFractionDigits: 6 })}</td>
                          <td className="px-5 py-4"><EngineBadge engine={item.engine} /></td>
                          <td className="px-5 py-4 text-right">
                            <button onClick={() => deleteLog(item.id)} className="rounded-lg p-2 text-slate-400 transition hover:bg-rose-50 hover:text-rose-600 focus:outline-none focus:ring-4 focus:ring-rose-100" title="Delete log">
                              <Icon name="x" />
                            </button>
                          </td>
                        </tr>
                      ))}
                      {logs.length === 0 && (
                        <tr>
                          <td colSpan="7" className="px-5 py-14 text-center text-slate-500">No conversions have been logged yet.</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
