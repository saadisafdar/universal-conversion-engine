<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Conversion Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-zinc-50 text-zinc-950">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      function Icon({ name, className = "h-4 w-4" }) {
        return <i data-lucide={name} className={className}></i>;
      }

      function App() {
        const [categories, setCategories] = useState([]);
        const [logs, setLogs] = useState([]);
        const [category, setCategory] = useState("");
        const [conversion, setConversion] = useState("");
        const [value, setValue] = useState("");
        const [rate, setRate] = useState("");
        const [preferMips, setPreferMips] = useState(false);
        const [status, setStatus] = useState("");
        const [busy, setBusy] = useState(false);

        useEffect(() => {
          Promise.all([fetch("/api/categories"), fetch("/api/logs")])
            .then(async ([categoryResponse, logResponse]) => {
              const categoryData = await categoryResponse.json();
              setCategories(categoryData);
              setLogs(await logResponse.json());
              setCategory(categoryData[0]?.id || "");
              setConversion(categoryData[0]?.conversions[0]?.id || "");
            })
            .catch(() => setStatus("Backend is not reachable."));
        }, []);

        useEffect(() => {
          const selected = categories.find((item) => item.id === category);
          setConversion(selected?.conversions[0]?.id || "");
        }, [category]);

        useEffect(() => {
          lucide.createIcons();
        });

        const selectedCategory = useMemo(
          () => categories.find((item) => item.id === category),
          [categories, category]
        );

        const selectedConversion = useMemo(
          () => selectedCategory?.conversions.find((item) => item.id === conversion),
          [selectedCategory, conversion]
        );

        const labels = useMemo(() => {
          const categoryMap = Object.fromEntries(categories.map((item) => [item.id, item.label]));
          const conversionMap = {};
          categories.forEach((item) => {
            item.conversions.forEach((conv) => {
              conversionMap[conv.id] = conv.label;
            });
          });
          return { categoryMap, conversionMap };
        }, [categories]);

        async function refreshLogs() {
          const response = await fetch("/api/logs");
          setLogs(await response.json());
        }

        async function handleConvert(event) {
          event.preventDefault();
          setBusy(true);
          setStatus("");
          try {
            const response = await fetch("/api/convert", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ category, conversion, value, rate, preferMips }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Conversion failed.");
            setLogs((current) => [data, ...current]);
            setStatus(`Result: ${Number(data.result).toLocaleString(undefined, { maximumFractionDigits: 6 })}`);
          } catch (error) {
            setStatus(error.message);
          } finally {
            setBusy(false);
          }
        }

        async function deleteLog(id) {
          await fetch(`/api/logs/${id}`, { method: "DELETE" });
          setLogs((current) => current.filter((item) => item.id !== id));
        }

        async function clearLogs() {
          await fetch("/api/logs", { method: "DELETE" });
          setLogs([]);
        }

        return (
          <main className="min-h-screen">
            <section className="border-b border-zinc-200 bg-white">
              <div className="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-5 sm:px-6 lg:flex-row lg:items-center lg:justify-between">
                <div>
                  <h1 className="text-2xl font-semibold tracking-normal">Universal Conversion Engine</h1>
                  <p className="mt-1 text-sm text-zinc-600">MIPS logic core, Flask bridge, persistent audit history.</p>
                </div>
                <div className="flex items-center gap-3 rounded border border-zinc-200 bg-zinc-50 px-3 py-2 text-sm">
                  <Icon name="database" />
                  <span>{logs.length} logged conversions</span>
                </div>
              </div>
            </section>

            <section className="mx-auto grid max-w-7xl gap-6 px-4 py-6 sm:px-6 lg:grid-cols-[360px_1fr]">
              <form onSubmit={handleConvert} className="rounded border border-zinc-200 bg-white p-4 shadow-sm">
                <div className="mb-4 flex items-center justify-between">
                  <h2 className="text-base font-semibold">Converter</h2>
                  <label className="flex items-center gap-2 text-sm text-zinc-600" title="Use MARS when MARS_JAR is configured">
                    <input
                      type="checkbox"
                      checked={preferMips}
                      onChange={(event) => setPreferMips(event.target.checked)}
                      className="h-4 w-4 rounded border-zinc-300"
                    />
                    MIPS mode
                  </label>
                </div>

                <label className="mb-3 block text-sm font-medium">
                  Category
                  <select value={category} onChange={(event) => setCategory(event.target.value)} className="mt-1 w-full rounded border border-zinc-300 bg-white px-3 py-2">
                    {categories.map((item) => <option key={item.id} value={item.id}>{item.label}</option>)}
                  </select>
                </label>

                <label className="mb-3 block text-sm font-medium">
                  Conversion
                  <select value={conversion} onChange={(event) => setConversion(event.target.value)} className="mt-1 w-full rounded border border-zinc-300 bg-white px-3 py-2">
                    {selectedCategory?.conversions.map((item) => <option key={item.id} value={item.id}>{item.label}</option>)}
                  </select>
                </label>

                <label className="mb-3 block text-sm font-medium">
                  Input Value
                  <input value={value} onChange={(event) => setValue(event.target.value)} required type="number" step="any" className="mt-1 w-full rounded border border-zinc-300 px-3 py-2" />
                </label>

                {selectedCategory?.requiresRate && (
                  <label className="mb-3 block text-sm font-medium">
                    Conversion Rate
                    <input value={rate} onChange={(event) => setRate(event.target.value)} required type="number" step="any" min="0" className="mt-1 w-full rounded border border-zinc-300 px-3 py-2" />
                  </label>
                )}

                <button disabled={busy} className="mt-2 flex w-full items-center justify-center gap-2 rounded bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-zinc-400">
                  <Icon name="calculator" />
                  {busy ? "Converting..." : "Convert"}
                </button>

                {status && <p className="mt-4 rounded border border-zinc-200 bg-zinc-50 px-3 py-2 text-sm text-zinc-700">{status}</p>}
              </form>

              <div className="rounded border border-zinc-200 bg-white shadow-sm">
                <div className="flex flex-col gap-3 border-b border-zinc-200 p-4 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <h2 className="text-base font-semibold">System Log</h2>
                    <p className="text-sm text-zinc-600">Audit trail for every conversion request.</p>
                  </div>
                  <button onClick={clearLogs} className="inline-flex items-center justify-center gap-2 rounded border border-zinc-300 px-3 py-2 text-sm font-medium hover:bg-zinc-50">
                    <Icon name="trash-2" />
                    Clear
                  </button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full min-w-[760px] border-collapse text-left text-sm">
                    <thead className="bg-zinc-50 text-xs uppercase text-zinc-500">
                      <tr>
                        <th className="px-4 py-3">Time</th>
                        <th className="px-4 py-3">Category</th>
                        <th className="px-4 py-3">Conversion</th>
                        <th className="px-4 py-3">Input</th>
                        <th className="px-4 py-3">Result</th>
                        <th className="px-4 py-3">Engine</th>
                        <th className="px-4 py-3"></th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-100">
                      {logs.map((item) => (
                        <tr key={item.id} className="hover:bg-zinc-50">
                          <td className="px-4 py-3 text-zinc-600">{new Date(item.created_at).toLocaleString()}</td>
                          <td className="px-4 py-3">{labels.categoryMap[item.category] || item.category}</td>
                          <td className="px-4 py-3">{labels.conversionMap[item.conversion] || item.conversion}</td>
                          <td className="px-4 py-3">{Number(item.input_value).toLocaleString()}</td>
                          <td className="px-4 py-3 font-medium">{Number(item.result).toLocaleString(undefined, { maximumFractionDigits: 6 })}</td>
                          <td className="px-4 py-3 text-zinc-600">{item.engine}</td>
                          <td className="px-4 py-3 text-right">
                            <button onClick={() => deleteLog(item.id)} className="rounded p-2 text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900" title="Delete log">
                              <Icon name="x" />
                            </button>
                          </td>
                        </tr>
                      ))}
                      {logs.length === 0 && (
                        <tr>
                          <td colSpan="7" className="px-4 py-10 text-center text-zinc-500">No conversions have been logged yet.</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
